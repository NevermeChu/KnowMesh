name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

jobs:
  build:
    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    name: Build with ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore or cache Next.js build
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: nextjs-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**') }}

      - name: Build Next.js
        run: npm run build-local
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: http://localhost:3008
          NEXT_PUBLIC_COLLABORATION_URL: ws://localhost:1234
          NEXT_PUBLIC_WHITEBOARD_COLLABORATION_ENABLED: 'true'
          NEXT_PUBLIC_WHITEBOARD_COLLABORATION_URL: http://localhost:1244

      - if: matrix.node-version == '24.x' && success()
        name: Cache Next.js build output
        uses: actions/cache/save@v5
        with:
          path: |
            .next
            next-env.d.ts
          key: nextjs-build-${{ matrix.node-version }}-${{ github.sha }}

  static:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Generate route types
        run: npx next typegen

      - name: TypeScript
        run: npm run check:types

      - name: Linter
        run: npm run lint

  unit:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit tests
        uses: docker://mcr.microsoft.com/playwright:v1.60.0
        with:
          args: npm run test -- --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          retention-days: 14

  e2e:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}
          restore-nextjs-cache: true

      - name: Run E2E tests
        uses: docker://mcr.microsoft.com/playwright:v1.60.0
        with:
          args: sh -c "HOME=/root npm run test:e2e" # Set HOME to /root to avoid Playwright error with Firebox
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          COLLABORATION_ADDRESS: 127.0.0.1
          COLLABORATION_ENABLED: 'true'
          COLLABORATION_HEALTH_PORT: '1235'
          COLLABORATION_PORT: '1234'
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
          E2E_REAL_POSTGRES: 'true'
          NEXT_PUBLIC_APP_URL: http://localhost:3008
          NEXT_PUBLIC_COLLABORATION_URL: ws://localhost:1234
          NEXT_PUBLIC_WHITEBOARD_COLLABORATION_ENABLED: 'true'
          NEXT_PUBLIC_WHITEBOARD_COLLABORATION_URL: http://localhost:1244
          WHITEBOARD_COLLABORATION_ADDRESS: 127.0.0.1
          WHITEBOARD_COLLABORATION_ENABLED: 'true'
          WHITEBOARD_COLLABORATION_HEALTH_PORT: '1245'
          WHITEBOARD_COLLABORATION_PORT: '1244'

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  packaging:
    name: Verify production packaging and deployment scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: 24.x

      - name: Run packaging smoke tests
        run: bash scripts/package-production-artifact.smoke.sh

      - name: Run deployment script smoke tests
        run: bash deploy/scripts/activate-release.smoke.sh

  deploy:
    name: Deploy production
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/permissions')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [build, static, unit, e2e, packaging]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.PRODUCTION_DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.PRODUCTION_DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.PRODUCTION_DEPLOY_USER }}
      EXPECTED_HOST_FINGERPRINT: ${{ vars.PRODUCTION_SSH_HOST_FINGERPRINT }}
      NODE_BINARY: ${{ vars.PRODUCTION_NODE_BINARY }}
      RELEASE_ROOT: ${{ vars.PRODUCTION_RELEASE_ROOT }}
      CURRENT_LINK: ${{ vars.PRODUCTION_CURRENT_LINK }}
      ENVIRONMENT_FILE: ${{ vars.PRODUCTION_ENVIRONMENT_FILE }}
      SERVICE_NAME: ${{ vars.PRODUCTION_SERVICE_NAME }}
      COLLABORATION_SERVICE_NAME: ${{ vars.PRODUCTION_COLLABORATION_SERVICE_NAME }}
      COLLABORATION_HEALTH_URL: ${{ vars.PRODUCTION_COLLABORATION_HEALTH_URL }}
      COLLABORATION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_COLLABORATION_ENABLED }}
      WHITEBOARD_COLLABORATION_SERVICE_NAME: ${{ vars.PRODUCTION_WHITEBOARD_COLLABORATION_SERVICE_NAME }}
      WHITEBOARD_COLLABORATION_HEALTH_URL: ${{ vars.PRODUCTION_WHITEBOARD_COLLABORATION_HEALTH_URL }}
      WHITEBOARD_COLLABORATION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_WHITEBOARD_COLLABORATION_ENABLED }}
      PUBLIC_HEALTH_URL: ${{ vars.PRODUCTION_APP_URL }}
      PUBLIC_COLLABORATION_URL: ${{ vars.PRODUCTION_COLLABORATION_URL }}
      PUBLIC_WHITEBOARD_COLLABORATION_URL: ${{ vars.PRODUCTION_WHITEBOARD_COLLABORATION_URL }}
      PUBLIC_APP_ORIGIN: ${{ vars.PRODUCTION_APP_URL }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up project
        uses: ./.github/actions/setup-project
        with:
          node-version: 24.x

      - name: Validate production deployment configuration
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          required=(
            DEPLOY_HOST DEPLOY_PORT DEPLOY_USER EXPECTED_HOST_FINGERPRINT NODE_BINARY
            RELEASE_ROOT CURRENT_LINK ENVIRONMENT_FILE SERVICE_NAME
            COLLABORATION_SERVICE_NAME COLLABORATION_HEALTH_URL COLLABORATION_DEPLOY_ENABLED
            WHITEBOARD_COLLABORATION_SERVICE_NAME WHITEBOARD_COLLABORATION_HEALTH_URL
            WHITEBOARD_COLLABORATION_DEPLOY_ENABLED PUBLIC_HEALTH_URL PUBLIC_COLLABORATION_URL
            PUBLIC_WHITEBOARD_COLLABORATION_URL PUBLIC_APP_ORIGIN BETTER_AUTH_SECRET
            DEPLOY_SSH_PRIVATE_KEY
          )
          missing=false
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required production configuration: ${name}"
              missing=true
            fi
          done
          if [[ "${missing}" == true ]]; then
            exit 1
          fi
          if [[ "${COLLABORATION_DEPLOY_ENABLED}" != true && "${COLLABORATION_DEPLOY_ENABLED}" != false ]]; then
            echo '::error::PRODUCTION_COLLABORATION_ENABLED must be true or false'
            exit 1
          fi
          if [[ "${WHITEBOARD_COLLABORATION_DEPLOY_ENABLED}" != true && "${WHITEBOARD_COLLABORATION_DEPLOY_ENABLED}" != false ]]; then
            echo '::error::PRODUCTION_WHITEBOARD_COLLABORATION_ENABLED must be true or false'
            exit 1
          fi

      - name: Build standalone application
        run: npm run build-local
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
          NEXT_PUBLIC_COLLABORATION_URL: ${{ vars.PRODUCTION_COLLABORATION_URL }}
          NEXT_PUBLIC_WHITEBOARD_COLLABORATION_ENABLED: ${{ vars.PRODUCTION_WHITEBOARD_COLLABORATION_ENABLED }}
          NEXT_PUBLIC_WHITEBOARD_COLLABORATION_URL: ${{ vars.PRODUCTION_WHITEBOARD_COLLABORATION_URL }}

      - name: Prepare production release
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}"
          bash scripts/package-production-artifact.sh \
            --repository-root . \
            --standalone-dir .next/standalone \
            --static-dir .next/static \
            --output "${RUNNER_TEMP}/knowmesh-release-${GITHUB_SHA}.tgz" \
            --revision "${GITHUB_SHA}"

      - name: Retain production artifact
        uses: actions/upload-artifact@v7
        with:
          name: knowmesh-${{ github.sha }}
          path: ${{ runner.temp }}/knowmesh-release-${{ github.sha }}.tgz
          retention-days: 14

      - name: Configure verified SSH access
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/knowmesh-deploy"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -p "${DEPLOY_PORT}" -t ed25519 "${DEPLOY_HOST}" > "${HOME}/.ssh/known_hosts" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          test -s "${HOME}/.ssh/known_hosts"
          mapfile -t fingerprints < <(ssh-keygen -lf "${HOME}/.ssh/known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          if [[ "${#fingerprints[@]}" -ne 1 || "${fingerprints[0]}" != "${EXPECTED_HOST_FINGERPRINT}" ]]; then
            echo 'Production SSH host fingerprint verification failed' >&2
            exit 1
          fi

      - name: Upload production release
        run: |
          set -euo pipefail
          scp \
            -i "${HOME}/.ssh/knowmesh-deploy" \
            -P "${DEPLOY_PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${RUNNER_TEMP}/knowmesh-release-${GITHUB_SHA}.tgz" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/knowmesh-release-${GITHUB_SHA}.tgz"

      - name: Migrate and activate production release
        run: |
          set -euo pipefail
          ssh \
            -i "${HOME}/.ssh/knowmesh-deploy" \
            -p "${DEPLOY_PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            sudo -n bash -s -- \
            "${GITHUB_SHA}" \
            "${RELEASE_ROOT}" \
            "${CURRENT_LINK}" \
            "${ENVIRONMENT_FILE}" \
            "${NODE_BINARY}" \
            "${SERVICE_NAME}" \
            "${COLLABORATION_SERVICE_NAME}" \
            "${COLLABORATION_HEALTH_URL}" \
            "${COLLABORATION_DEPLOY_ENABLED}" \
            "${DEPLOY_USER}" \
            "${WHITEBOARD_COLLABORATION_SERVICE_NAME}" \
            "${WHITEBOARD_COLLABORATION_HEALTH_URL}" \
            "${WHITEBOARD_COLLABORATION_DEPLOY_ENABLED}" \
            < deploy/scripts/activate-release.sh

      - name: Verify public production and finalize
        run: |
          set -euo pipefail

          public_application_healthy=false
          if curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            "${PUBLIC_HEALTH_URL}" >/dev/null; then
            public_application_healthy=true
          fi

          public_collaboration_healthy=true
          if [[ "${COLLABORATION_DEPLOY_ENABLED}" == true ]]; then
            public_collaboration_healthy=false
            if [[ "${PUBLIC_COLLABORATION_URL}" != wss://* ]]; then
              echo 'Public collaboration URL must use wss' >&2
              websocket_status=000
              websocket_exit=1
            else
              websocket_http_url="https://${PUBLIC_COLLABORATION_URL#wss://}"
              set +e
              websocket_status=$(curl \
                --http1.1 \
                --max-time 5 \
                --output /dev/null \
                --silent \
                --write-out '%{http_code}' \
                --header "Origin: ${PUBLIC_APP_ORIGIN}" \
                --header 'Connection: Upgrade' \
                --header 'Upgrade: websocket' \
                --header 'Sec-WebSocket-Version: 13' \
                --header 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
                "${websocket_http_url}")
              websocket_exit=$?
              set -e
            fi
            if [[ "${websocket_status}" == 101 && ( "${websocket_exit}" -eq 0 || "${websocket_exit}" -eq 28 ) ]]; then
              public_collaboration_healthy=true
            fi
          fi

          public_whiteboard_collaboration_healthy=true
          if [[ "${WHITEBOARD_COLLABORATION_DEPLOY_ENABLED}" == true ]]; then
            public_whiteboard_collaboration_healthy=false
            whiteboard_ws_url="${PUBLIC_APP_ORIGIN%/}/whiteboard-collaboration/socket.io/?EIO=4&transport=websocket"
            set +e
            whiteboard_websocket_status=$(curl \
              --http1.1 \
              --max-time 5 \
              --output /dev/null \
              --silent \
              --write-out '%{http_code}' \
              --header "Origin: ${PUBLIC_APP_ORIGIN}" \
              --header 'Connection: Upgrade' \
              --header 'Upgrade: websocket' \
              --header 'Sec-WebSocket-Version: 13' \
              --header 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
              "${whiteboard_ws_url}")
            whiteboard_websocket_exit=$?
            set -e
            if [[ "${whiteboard_websocket_status}" == 101 && ( "${whiteboard_websocket_exit}" -eq 0 || "${whiteboard_websocket_exit}" -eq 28 ) ]]; then
              public_whiteboard_collaboration_healthy=true
            fi
          fi

          if [[ "${public_application_healthy}" == true && "${public_collaboration_healthy}" == true && "${public_whiteboard_collaboration_healthy}" == true ]]; then
            ssh \
              -i "${HOME}/.ssh/knowmesh-deploy" \
              -p "${DEPLOY_PORT}" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              sudo -n rm -f -- "${RELEASE_ROOT}/.previous-${GITHUB_SHA}"
            exit 0
          fi

          ssh \
            -i "${HOME}/.ssh/knowmesh-deploy" \
            -p "${DEPLOY_PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            sudo -n bash -s -- \
            "${GITHUB_SHA}" \
            "${RELEASE_ROOT}" \
            "${CURRENT_LINK}" \
            "${SERVICE_NAME}" \
            "${COLLABORATION_SERVICE_NAME}" \
            "${COLLABORATION_DEPLOY_ENABLED}" \
            "${WHITEBOARD_COLLABORATION_SERVICE_NAME}" \
            "${WHITEBOARD_COLLABORATION_DEPLOY_ENABLED}" \
            < deploy/scripts/rollback-release.sh
          echo 'Public production health check failed; application and collaboration releases were rolled back' >&2
          exit 1
