name: CI

on:
  push:
    branches: [main, feature/permissions]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

jobs:
  build:
    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    name: Build with ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore or cache Next.js build
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: nextjs-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**') }}

      - name: Build Next.js
        run: npm run build-local
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: http://localhost:3008

      - if: matrix.node-version == '24.x' && success()
        name: Cache Next.js build output
        uses: actions/cache/save@v5
        with:
          path: |
            .next
            next-env.d.ts
          key: nextjs-build-${{ matrix.node-version }}-${{ github.sha }}

  static:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Linter
        run: npx next typegen && npm run lint

  unit:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit tests
        uses: docker://mcr.microsoft.com/playwright:v1.60.0
        with:
          args: npm run test -- --coverage

  e2e:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}
          restore-nextjs-cache: true

      - name: Run E2E tests
        uses: docker://mcr.microsoft.com/playwright:v1.60.0
        with:
          args: sh -c "HOME=/root npm run test:e2e" # Set HOME to /root to avoid Playwright error with Firebox
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          COLLABORATION_ADDRESS: 127.0.0.1
          COLLABORATION_ENABLED: 'true'
          COLLABORATION_HEALTH_PORT: '1235'
          COLLABORATION_PORT: '1234'
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
          E2E_REAL_POSTGRES: 'true'
          NEXT_PUBLIC_APP_URL: http://localhost:3008
          NEXT_PUBLIC_COLLABORATION_URL: ws://localhost:1234

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy production
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/feature/permissions')
    needs: [build, static, unit, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      DEPLOY_HOST: 20.46.165.183
      DEPLOY_PORT: '22'
      DEPLOY_USER: thisme
      EXPECTED_HOST_FINGERPRINT: SHA256:s8fwWfOG9piXBn7D7gxG98WflWbmvvOeZyDoRUy2o+A
      NODE_BINARY: /home/thisme/.nvm/versions/node/v24.19.0/bin/node
      RELEASE_ROOT: /srv/knowmesh-app/releases
      CURRENT_LINK: /srv/knowmesh-app/current
      ENVIRONMENT_FILE: /etc/knowmesh.env
      SERVICE_NAME: knowmesh.service
      COLLABORATION_SERVICE_NAME: knowmesh-collaboration.service
      COLLABORATION_HEALTH_URL: http://127.0.0.1:1235/ready
      COLLABORATION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_COLLABORATION_ENABLED || 'false' }}
      PUBLIC_HEALTH_URL: https://thisme.icu/
      PUBLIC_COLLABORATION_URL: ${{ vars.PRODUCTION_COLLABORATION_URL }}
      PUBLIC_APP_ORIGIN: ${{ vars.PRODUCTION_APP_URL }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up project
        uses: ./.github/actions/setup-project
        with:
          node-version: 24.x

      - name: Build standalone application
        run: npm run build-local
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
          NEXT_PUBLIC_COLLABORATION_URL: ${{ vars.PRODUCTION_COLLABORATION_URL }}

      - name: Prepare production release
        run: |
          set -euo pipefail
          npx --no-install esbuild scripts/migrate-production.ts \
            --bundle \
            --platform=node \
            --target=node24 \
            --format=cjs \
            --outfile=.next/standalone/migrate-production.cjs
          npx --no-install esbuild scripts/collaboration-server.ts \
            --bundle \
            --platform=node \
            --target=node24 \
            --format=cjs \
            --define:import.meta.url=import_meta_url \
            --banner:js="const import_meta_url = require('node:url').pathToFileURL(__filename).href;" \
            --outfile=.next/standalone/collaboration-server.cjs
          mkdir -p .next/standalone/public .next/standalone/.next/static .next/standalone/migrations .next/standalone/deploy
          cp -r public/. .next/standalone/public/
          cp -r .next/static/. .next/standalone/.next/static/
          cp -r migrations/. .next/standalone/migrations/
          cp -r deploy/. .next/standalone/deploy/
          rm -f .next/standalone/.env*
          test -f .next/standalone/server.js
          test -f .next/standalone/migrate-production.cjs
          test -f .next/standalone/collaboration-server.cjs
          test -d .next/standalone/.next/static
          test -d .next/standalone/public
          test -f .next/standalone/migrations/meta/_journal.json
          test -f .next/standalone/deploy/systemd/knowmesh-collaboration.service
          test -f .next/standalone/deploy/nginx/knowmesh-websocket-map.conf
          test -f .next/standalone/deploy/nginx/knowmesh-collaboration-location.conf
          tar -C .next/standalone -czf "${RUNNER_TEMP}/knowmesh-release-${GITHUB_SHA}.tgz" .

      - name: Retain production artifact
        uses: actions/upload-artifact@v7
        with:
          name: knowmesh-${{ github.sha }}
          path: ${{ runner.temp }}/knowmesh-release-${{ github.sha }}.tgz
          retention-days: 14

      - name: Configure verified SSH access
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/knowmesh-deploy"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -p "${DEPLOY_PORT}" -t ed25519 "${DEPLOY_HOST}" > "${HOME}/.ssh/known_hosts" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          test -s "${HOME}/.ssh/known_hosts"
          mapfile -t fingerprints < <(ssh-keygen -lf "${HOME}/.ssh/known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          if [[ "${#fingerprints[@]}" -ne 1 || "${fingerprints[0]}" != "${EXPECTED_HOST_FINGERPRINT}" ]]; then
            echo 'Production SSH host fingerprint verification failed' >&2
            exit 1
          fi

      - name: Upload production release
        run: |
          set -euo pipefail
          scp \
            -i "${HOME}/.ssh/knowmesh-deploy" \
            -P "${DEPLOY_PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${RUNNER_TEMP}/knowmesh-release-${GITHUB_SHA}.tgz" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/knowmesh-release-${GITHUB_SHA}.tgz"

      - name: Migrate and activate production release
        run: |
          set -euo pipefail
          ssh \
            -i "${HOME}/.ssh/knowmesh-deploy" \
            -p "${DEPLOY_PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            sudo -n bash -s -- \
            "${GITHUB_SHA}" \
            "${RELEASE_ROOT}" \
            "${CURRENT_LINK}" \
            "${ENVIRONMENT_FILE}" \
            "${NODE_BINARY}" \
            "${SERVICE_NAME}" \
            "${COLLABORATION_SERVICE_NAME}" \
            "${COLLABORATION_HEALTH_URL}" \
            "${COLLABORATION_DEPLOY_ENABLED}" <<'REMOTE'
          set -euo pipefail

          release_id=$1
          release_root=$2
          current_link=$3
          environment_file=$4
          node_binary=$5
          service_name=$6
          collaboration_service_name=$7
          collaboration_health_url=$8
          collaboration_deploy_enabled=$9

          if [[ ! "${release_id}" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Invalid release ID' >&2
            exit 1
          fi

          archive="/tmp/knowmesh-release-${release_id}.tgz"
          release_dir="${release_root}/${release_id}"
          staging_dir="${release_root}/.${release_id}.staging"
          rollback_marker="${release_root}/.previous-${release_id}"
          temporary_link="${current_link}.next-${release_id}"

          cleanup() {
            rm -f -- "${archive}" "${temporary_link}"
            if [[ -d "${staging_dir}" ]]; then
              rm -rf -- "${staging_dir}"
            fi
          }
          trap cleanup EXIT

          install -d -o thisme -g thisme "${release_root}"
          test -f "${archive}"

          if [[ ! -d "${release_dir}" ]]; then
            rm -rf -- "${staging_dir}"
            install -d -o thisme -g thisme "${staging_dir}"
            tar -xzf "${archive}" -C "${staging_dir}"
            test -f "${staging_dir}/server.js"
            test -f "${staging_dir}/migrate-production.cjs"
            test -f "${staging_dir}/collaboration-server.cjs"
            test -d "${staging_dir}/.next/static"
            test -d "${staging_dir}/public"
            test -f "${staging_dir}/migrations/meta/_journal.json"
            test -f "${staging_dir}/deploy/systemd/knowmesh-collaboration.service"
            test -f "${staging_dir}/deploy/nginx/knowmesh-websocket-map.conf"
            test -f "${staging_dir}/deploy/nginx/knowmesh-collaboration-location.conf"
            chown -R thisme:thisme "${staging_dir}"
            mv -- "${staging_dir}" "${release_dir}"
          fi

          test -f "${release_dir}/server.js"
          test -f "${release_dir}/migrate-production.cjs"
          test -f "${release_dir}/collaboration-server.cjs"
          test -d "${release_dir}/.next/static"
          test -d "${release_dir}/public"
          test -f "${release_dir}/migrations/meta/_journal.json"
          test -f "${release_dir}/deploy/systemd/knowmesh-collaboration.service"
          test -f "${release_dir}/deploy/nginx/knowmesh-websocket-map.conf"
          test -f "${release_dir}/deploy/nginx/knowmesh-collaboration-location.conf"
          test -r "${environment_file}"
          test -x "${node_binary}"

          if [[ "${collaboration_deploy_enabled}" != true && "${collaboration_deploy_enabled}" != false ]]; then
            echo 'Invalid production collaboration deployment flag' >&2
            exit 1
          fi

          environment_collaboration_enabled=false
          if grep -Eq '^[[:space:]]*COLLABORATION_ENABLED[[:space:]]*=[[:space:]]*true[[:space:]]*$' "${environment_file}" || \
            grep -Eq '^[[:space:]]*COLLABORATION_ENABLED[[:space:]]*=[[:space:]]*"true"[[:space:]]*$' "${environment_file}" || \
            grep -Eq "^[[:space:]]*COLLABORATION_ENABLED[[:space:]]*=[[:space:]]*'true'[[:space:]]*$" "${environment_file}"; then
            environment_collaboration_enabled=true
          fi
          if [[ "${environment_collaboration_enabled}" != "${collaboration_deploy_enabled}" ]]; then
            echo 'GitHub and server collaboration flags do not match' >&2
            exit 1
          fi
          if [[ "${collaboration_deploy_enabled}" == true ]]; then
            systemctl cat "${collaboration_service_name}" >/dev/null
          fi

          "${node_binary}" "${release_dir}/migrate-production.cjs" "${environment_file}"

          old_release=$(readlink -f "${current_link}")
          if [[ -z "${old_release}" || ! -d "${old_release}" ]]; then
            echo 'Current production release is unavailable for rollback' >&2
            exit 1
          fi
          printf '%s\n' "${old_release}" > "${rollback_marker}"

          rm -f -- "${temporary_link}"
          ln -s "${release_dir}" "${temporary_link}"
          mv -Tf -- "${temporary_link}" "${current_link}"

          collaboration_healthy=true
          if [[ "${collaboration_deploy_enabled}" == true ]]; then
            collaboration_healthy=false
            if systemctl restart "${collaboration_service_name}"; then
              for attempt in $(seq 1 30); do
                if curl --fail --silent --show-error "${collaboration_health_url}" >/dev/null; then
                  collaboration_healthy=true
                  break
                fi
                sleep 2
              done
            fi
          fi

          application_healthy=false
          if [[ "${collaboration_healthy}" == true ]] && systemctl restart "${service_name}"; then
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
                application_healthy=true
                break
              fi
              sleep 2
            done
          fi

          if [[ "${collaboration_healthy}" != true || "${application_healthy}" != true ]]; then
            rollback_link="${current_link}.rollback-${release_id}"
            rm -f -- "${rollback_link}"
            ln -s "${old_release}" "${rollback_link}"
            mv -Tf -- "${rollback_link}" "${current_link}"
            if [[ "${collaboration_deploy_enabled}" == true ]]; then
              systemctl restart "${collaboration_service_name}" || true
            fi
            systemctl restart "${service_name}" || true
            rm -f -- "${rollback_marker}"
            echo 'Local production health check failed; application and collaboration releases were rolled back' >&2
            exit 1
          fi
          REMOTE

      - name: Verify public production and finalize
        run: |
          set -euo pipefail

          public_application_healthy=false
          if curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            "${PUBLIC_HEALTH_URL}" >/dev/null; then
            public_application_healthy=true
          fi

          public_collaboration_healthy=true
          if [[ "${COLLABORATION_DEPLOY_ENABLED}" == true ]]; then
            public_collaboration_healthy=false
            if [[ "${PUBLIC_COLLABORATION_URL}" != wss://* ]]; then
              echo 'Public collaboration URL must use wss' >&2
              websocket_status=000
              websocket_exit=1
            else
              websocket_http_url="https://${PUBLIC_COLLABORATION_URL#wss://}"
              set +e
              websocket_status=$(curl \
                --http1.1 \
                --max-time 5 \
                --output /dev/null \
                --silent \
                --write-out '%{http_code}' \
                --header "Origin: ${PUBLIC_APP_ORIGIN}" \
                --header 'Connection: Upgrade' \
                --header 'Upgrade: websocket' \
                --header 'Sec-WebSocket-Version: 13' \
                --header 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
                "${websocket_http_url}")
              websocket_exit=$?
              set -e
            fi
            if [[ "${websocket_status}" == 101 && ( "${websocket_exit}" -eq 0 || "${websocket_exit}" -eq 28 ) ]]; then
              public_collaboration_healthy=true
            fi
          fi

          if [[ "${public_application_healthy}" == true && "${public_collaboration_healthy}" == true ]]; then
            ssh \
              -i "${HOME}/.ssh/knowmesh-deploy" \
              -p "${DEPLOY_PORT}" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              sudo -n rm -f -- "${RELEASE_ROOT}/.previous-${GITHUB_SHA}"
            exit 0
          fi

          ssh \
            -i "${HOME}/.ssh/knowmesh-deploy" \
            -p "${DEPLOY_PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            sudo -n bash -s -- \
            "${GITHUB_SHA}" \
            "${RELEASE_ROOT}" \
            "${CURRENT_LINK}" \
            "${SERVICE_NAME}" \
            "${COLLABORATION_SERVICE_NAME}" \
            "${COLLABORATION_DEPLOY_ENABLED}" <<'ROLLBACK'
          set -euo pipefail

          release_id=$1
          release_root=$2
          current_link=$3
          service_name=$4
          collaboration_service_name=$5
          collaboration_deploy_enabled=$6

          if [[ ! "${release_id}" =~ ^[0-9a-f]{40}$ ]]; then
            exit 1
          fi

          rollback_marker="${release_root}/.previous-${release_id}"
          old_release=$(cat "${rollback_marker}")
          if [[ "${old_release}" != "${release_root}/"* || ! -d "${old_release}" ]]; then
            echo 'Rollback target is invalid' >&2
            exit 1
          fi

          rollback_link="${current_link}.rollback-${release_id}"
          rm -f -- "${rollback_link}"
          ln -s "${old_release}" "${rollback_link}"
          mv -Tf -- "${rollback_link}" "${current_link}"
          if [[ "${collaboration_deploy_enabled}" == true ]]; then
            systemctl restart "${collaboration_service_name}" || true
          fi
          systemctl restart "${service_name}" || true
          rm -f -- "${rollback_marker}"
          ROLLBACK
          echo 'Public production health check failed; application and collaboration releases were rolled back' >&2
          exit 1
