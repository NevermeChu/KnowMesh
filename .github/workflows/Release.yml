name: Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build production artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up project
        uses: ./.github/actions/setup-project
        with:
          node-version: 24.x

      - name: Validate build configuration
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
          NEXT_PUBLIC_COLLABORATION_URL: ${{ vars.PRODUCTION_COLLABORATION_URL }}
          NEXT_PUBLIC_WHITEBOARD_COLLABORATION_ENABLED: ${{ vars.PRODUCTION_WHITEBOARD_COLLABORATION_ENABLED }}
          NEXT_PUBLIC_WHITEBOARD_COLLABORATION_URL: ${{ vars.PRODUCTION_WHITEBOARD_COLLABORATION_URL }}
        run: |
          set -euo pipefail
          required=(
            BETTER_AUTH_SECRET NEXT_PUBLIC_APP_URL NEXT_PUBLIC_COLLABORATION_URL
            NEXT_PUBLIC_WHITEBOARD_COLLABORATION_ENABLED NEXT_PUBLIC_WHITEBOARD_COLLABORATION_URL
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required build configuration: ${name}"
              exit 1
            fi
          done
          if [[ "${NEXT_PUBLIC_WHITEBOARD_COLLABORATION_ENABLED}" != true && "${NEXT_PUBLIC_WHITEBOARD_COLLABORATION_ENABLED}" != false ]]; then
            echo '::error::PRODUCTION_WHITEBOARD_COLLABORATION_ENABLED must be true or false'
            exit 1
          fi

      - name: Build standalone application
        run: npm run build-local
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
          NEXT_PUBLIC_COLLABORATION_URL: ${{ vars.PRODUCTION_COLLABORATION_URL }}
          NEXT_PUBLIC_WHITEBOARD_COLLABORATION_ENABLED: ${{ vars.PRODUCTION_WHITEBOARD_COLLABORATION_ENABLED }}
          NEXT_PUBLIC_WHITEBOARD_COLLABORATION_URL: ${{ vars.PRODUCTION_WHITEBOARD_COLLABORATION_URL }}

      - name: Prepare production artifact
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}"
          bash scripts/package-production-artifact.sh \
            --repository-root . \
            --standalone-dir .next/standalone \
            --static-dir .next/static \
            --output "${RUNNER_TEMP}/knowmesh-release-${GITHUB_SHA}.tgz" \
            --revision "${GITHUB_SHA}"

      - name: Upload production artifact
        uses: actions/upload-artifact@v7
        with:
          name: knowmesh-${{ github.sha }}
          path: ${{ runner.temp }}/knowmesh-release-${{ github.sha }}.tgz
          retention-days: 14
